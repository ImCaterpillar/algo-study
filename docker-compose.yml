name: algo-study

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_CODE_RUNNERS: ${INSTALL_CODE_RUNNERS:-false}
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/algo_study.db
      APP_ENV: ${APP_ENV:-production}
      CREATE_DEMO_USER: ${CREATE_DEMO_USER:-false}
      CODE_EXECUTION_ENABLED: ${CODE_EXECUTION_ENABLED:-false}
    volumes:
      - algo_study_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  algo_study_data:
